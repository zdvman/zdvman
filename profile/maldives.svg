<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Maldives: AI search and offer engine</title>
  <desc id="desc">A project in development. System design: hotel contracts are interpreted with AI, then validated and reviewed before deterministic calculations produce explainable offers.</desc>
