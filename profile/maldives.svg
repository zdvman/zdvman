    <text x="58" y="359" fill="#d8e6df" font-size="24" letter-spacing="-.3">Making resort contracts</text>
    <text x="58" y="394" fill="#d8e6df" font-size="24" letter-spacing="-.3">computable.</text>
    <text x="58" y="524" fill="#b8ccc5" font-size="14">AI interprets. Rules calculate.</text>
    <text x="58" y="567" fill="#6e9c98" font-size="10" font-weight="700" letter-spacing="2.4">TRAVEL TECHNOLOGY / INDEPENDENTLY BUILT</text>

