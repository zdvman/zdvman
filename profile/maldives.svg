    <text x="691" y="423" fill="#92ddc4" font-size="10" font-weight="700" letter-spacing="1.5">05 / EXPLAINABLE OFFER</text>
    <text x="691" y="458" fill="#edf3ee" font-size="20" font-weight="700" letter-spacing="-.3">Every result, traceable.</text>
