    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#83edcf"/><stop offset="1" stop-color="#c3f884"/></linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#80baa9" stroke-width="1.1"/></marker>
  </defs>
  <rect width="1600" height="620" rx="26" fill="url(#bg)"/>
